<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administration — CycleRush</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap">
<style>/* Administration CycleRush — barre latérale, en-tête, tableaux denses. */
:root{
  --bg:#04070d; --bg2:#08111f; --panel:#0c182c; --panel2:#11223d; --line:#1b2d4b; --line2:#264065;
  --fg:#e8f3fb; --muted:#90a7c0; --dim:#62789a; --cyan:#22d3ee; --teal:#2dd4bf; --ink:#04202a;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px;text-decoration:none;color:var(--fg);padding:4px 10px 4px}
.logo>span{color:var(--fg)}
.logo>span>span{color:var(--cyan)}
.blocked-box .logo{display:block}
.blocked-box .logo span{color:var(--cyan)}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side nav{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.side nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.side nav a:hover{background:var(--panel);color:var(--fg)}
.side nav a[aria-current="page"]{background:rgba(34,211,238,.12);color:var(--fg);box-shadow:inset 3px 0 0 var(--cyan)}
.count{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--cyan);color:var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.side .back{margin-top:auto;color:var(--muted);text-decoration:none;padding:10px 12px;border-radius:10px}
.side .back:hover{background:var(--panel);color:var(--fg)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 14px 24px;border-bottom:1px solid var(--line);background:rgba(4,7,13,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.top h1{font-size:22px}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.who b{color:var(--fg)}
.burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.shell>div{min-width:0}
.content>*,.card,.grid2>*{min-width:0}
.content{padding:24px max(24px,env(safe-area-inset-right,0px)) 48px 24px;display:flex;flex-direction:column;gap:18px;max-width:1300px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{font-size:17px;margin-bottom:12px}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.alert{border-color:rgba(251,191,36,.5)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chart{width:100%;height:auto;display:block}
.def{font-size:13px;color:var(--dim);margin:0}

.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.link{cursor:pointer}
tbody tr.link:hover{background:var(--panel2)}
td.num{font-variant-numeric:tabular-nums}
.ava{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0e7490,#0f766e);display:inline-grid;place-items:center;font-weight:700;font-size:12px;overflow:hidden;vertical-align:middle;margin-right:8px}
.ava img{width:100%;height:100%;object-fit:cover}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input,select.input,textarea.input{padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--fg)}
.input:focus{outline:none;border-color:var(--cyan)}
textarea.input{width:100%;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--teal));color:var(--ink);border-color:transparent}
.btn.danger{background:transparent;color:#fecaca;border-color:rgba(248,113,113,.55)}
.btn.danger:hover{background:rgba(248,113,113,.12)}
.btn.warn{background:transparent;color:#fde68a;border-color:rgba(251,191,36,.55)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.5)}
.pill.warn{color:var(--warn);border-color:rgba(251,191,36,.5)}
.pill.bad{color:var(--bad);border-color:rgba(248,113,113,.5)}
.pill.cyan{color:var(--cyan);border-color:rgba(34,211,238,.5)}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line2);border-radius:12px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{padding:6px 14px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);text-decoration:none;font-size:14px}
.tabs a[aria-current="page"]{border-color:var(--cyan);color:var(--fg);background:rgba(34,211,238,.1)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.note{border-left:3px solid var(--cyan);padding:6px 12px;background:var(--bg2);border-radius:0 8px 8px 0;margin-bottom:8px}
.note small{color:var(--dim)}
.alert{padding:10px 14px;border-radius:10px;border:1px solid var(--line2)}
.alert.bad{border-color:rgba(248,113,113,.5);color:#fecaca;background:rgba(248,113,113,.07)}
.alert.info{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.06)}

.modal-bg{position:fixed;inset:0;background:rgba(2,5,10,.75);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px;width:100%;max-width:500px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h2{font-size:19px}
.modal-acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(400px,calc(100% - 32px))}
.toast{padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast.ok{border-color:rgba(52,211,153,.6)}
.toast.bad{border-color:rgba(248,113,113,.6)}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* Page « accès refusé » */
body.blocked{display:grid;place-items:center;min-height:100vh;padding:16px;background:radial-gradient(600px 300px at 50% 0%,rgba(34,211,238,.12),transparent 70%),var(--bg)}
.blocked-box{max-width:440px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px}
.blocked-box .logo{justify-content:center;font-size:24px;margin-bottom:12px}
.blocked-box h1{font-size:24px;margin-bottom:8px}
.blocked-box p{color:var(--muted)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;height:100%}
  .side.open{transform:none;box-shadow:20px 0 40px rgba(0,0,0,.5)}
  .burger{display:grid;place-items:center}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .who span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.bike-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bike-list li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;min-width:0}
.bike-list .bl-name{display:flex;flex-direction:column;flex:1 1 140px;min-width:0}.bike-list .bl-name .muted{font-size:13px}
/* Sessions multijoueur : changements de statut */
.mp-ev{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:260px;overflow:auto}
details summary{cursor:pointer;color:var(--cyan)}

/* Équipements & Récompenses */
.thumb{width:64px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--cyan);font-size:18px;vertical-align:middle}
.stat .bar{margin:8px 0 4px}
.bar{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--teal));transition:width .3s}
/* Gestion des parcours */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.rcard{display:flex;flex-direction:column}
.rcard .acts{margin-top:auto}
.rimg{aspect-ratio:2/1;border-radius:12px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.rplan{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:120px;background:radial-gradient(circle at 30% 20%,rgba(34,211,238,.08),transparent 60%),var(--bg2)}
.rplan.big{min-height:160px;border-radius:12px;border:1px solid var(--line)}
.plan{width:100%;height:auto;max-height:420px;display:block}
.rhero{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-bottom:12px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;padding:8px 10px;border:1px solid var(--line2);border-radius:10px}
.checks li>span:first-child{font-weight:700}
.checks li.ok>span:first-child{color:var(--ok)}
.checks li.ko{border-color:rgba(248,113,113,.45)}
.checks li.ko>span:first-child{color:var(--bad)}
.checks .muted{font-size:13px}
.alert.ok{border:1px solid rgba(52,211,153,.45);color:var(--ok);background:rgba(52,211,153,.08);padding:10px 12px;border-radius:10px}
details summary{cursor:pointer}
td details dl{font-size:13px}
td code{word-break:break-all;white-space:pre-wrap}
@media (max-width:720px){.thumb{width:48px;height:30px}}

table.nowrap td,table.nowrap th{white-space:nowrap}
</style>
<script src="demo-api.js"></script></head>
<body><div id="admin"><div class="loading">Chargement…</div></div><script type="module" src="admin.js"></script></body></html>
